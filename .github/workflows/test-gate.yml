name: test-gate
"on":
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  canonical-tests:
    name: canonical tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      tests_ran: ${{ steps.test.outputs.tests_ran }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - id: test
        name: Run canonical non-E2E tests
        env:
          RUBIO_TEST_GATE_COUNT_OUTPUT: ${{ runner.temp }}/test-gate-count
        run: |
          set -euo pipefail
          rm -f "$RUBIO_TEST_GATE_COUNT_OUTPUT"
          mise run test
          test -s "$RUBIO_TEST_GATE_COUNT_OUTPUT"
          test "$(cat "$RUBIO_TEST_GATE_COUNT_OUTPUT")" -gt 0
          echo "tests_ran=true" >> "$GITHUB_OUTPUT"

  aggregate:
    name: test-gate
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [canonical-tests]
    runs-on: ubuntu-latest
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Require successful non-empty test execution
        run: >-
          jq -e 'length > 0 and all(.[]; .result == "success" and
          .outputs.tests_ran == "true")' <<<"$NEEDS_JSON"
