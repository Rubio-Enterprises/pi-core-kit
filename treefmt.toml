# @generated by rubio-standards. DO NOT EDIT: rebuilt from the org lint rules + treefmt.toml.local.
# Repo-specific changes: edit treefmt.toml.local, then run `mise run lint-config`.
# CI fails if this file doesn't match that rebuild.

# Resolve from subdirectories too; formatter processes run at this root so mise
# and native tool configs resolve identically for hooks, CI and coding agents.
tree-root-file = "treefmt.toml"
on-unmatched = "debug"
# treefmt 2.6 uses gobwas globs WITHOUT separator arguments: * spans /, but
# **/ requires a slash. Brace prefixes cover root AND nested lockfiles without
# overmatching e.g. my-pnpm-lock.yaml. These exclusions also cover absolute args
# after treefmt resolves them relative to the root. Xcode asset-catalog
# manifests are Xcode's own output: formatting them would make Xcode and Biome
# undo each other. Keep comments OUT of this array: the Config Delta merge
# (merge-treefmt.sh) does not preserve comments inside arrays.
excludes = [
  "{,**/}pnpm-lock.yaml",
  "{,**/}package-lock.json",
  "{,**/}yarn.lock",
  "{,**/}uv.lock",
  "{,**/}Cargo.lock",
  "{,**/}poetry.lock",
  "{,**/}mise.lock",
  "{,**/}modify_*",
  "*.tmpl",
  "*.xcassets/{,**/}Contents.json",
  ".github/actions/**/action.yml",
  ".copier-answers.yml",
]

[formatter.markdownlint]
command = "mise"
options = ["exec", "--", "markdownlint-cli2", "--fix"]
includes = ["*.md"]

[formatter.yaml-prettier]
command = "mise"
options = ["exec", "--", "prettier", "--write"]
includes = ["*.yml", "*.yaml"]

[formatter.shfmt]
command = "mise"
options = ["exec", "--", "shfmt", "-w"]
includes = ["*.sh", "*.bash"]

[formatter.biome]
command = "mise"
options = ["exec", "--", "biome", "check", "--write", "--error-on-warnings", "--no-errors-on-unmatched"]
includes = ["*.js", "*.jsx", "*.ts", "*.tsx", "*.mjs", "*.cjs", "*.json", "*.jsonc"]

[formatter.tombi]
command = "mise"
options = ["exec", "--", "tombi", "format"]
includes = ["*.toml"]
